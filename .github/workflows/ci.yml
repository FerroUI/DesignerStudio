name: CI

# The browser site of Designer Studio and its GitHub Pages deployment, with the shared application
# workflow of FerroUI (FerroUI/docs/apps.md): the conventions, a native build of the host, the site built
# from the sources of the submodule, a smoke run of the site in headless Chrome, and the deployment
# from runs of main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  app:
    uses: wieslawsoltes/FerroUI/.github/workflows/app.yml@main
    with:
      test: ''
      check: |
        -p designer-studio-browser
      browser-package: designer-studio-browser
      # The site in the runner's Chrome with FerroUI's browser harness: it loads and draws, and the
      # Preview button opens the preview without an error (no npm packages needed).
      browser-tests-setup: ''
      browser-tests: node DesignerStudio.Browser/tests/browser-smoke.mjs "$SITE"
